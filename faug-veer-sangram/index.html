<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faug Veer Sangram — Tournament Bracket</title>
  <meta name="description" content="Faug Veer Sangram — 16-team double elimination tournament bracket.">

  <!-- Optional webfont. The page falls back to a condensed system font when offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="chips">
        <span class="chip">16 Teams</span>
        <span class="chip-sep" aria-hidden="true"></span>
        <span class="chip">Double Elimination</span>
      </div>
      <h1 class="title">FAUG VEER SANGRAM</h1>
      <p class="subtitle"><span>TOURNAMENT BRACKET</span></p>
    </div>
  </header>

  <main>
    <p class="scroll-hint" aria-hidden="true">Swipe sideways to explore the full bracket &rarr;</p>

    <!-- Everything inside #canvas is generated by script.js from the tournament data. -->
    <div class="viewport" id="viewport" tabindex="-1">
      <div class="stage" id="stage">
        <div class="canvas" id="canvas" role="group" aria-label="Faug Veer Sangram tournament bracket"></div>
      </div>
    </div>

    <noscript><p class="noscript">This bracket needs JavaScript enabled to render.</p></noscript>
  </main>

  <footer class="foot">FAUG VEER SANGRAM &middot; 16-TEAM DOUBLE ELIMINATION</footer>

  <script src="script.js"></script>
</body>
</html>
